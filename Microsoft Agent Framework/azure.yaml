# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: agent-framework-demo
metadata:
    template: azd-init@1.23.10
services:
    agent-framework:
        project: .
        host: containerapp
        language: python
        docker:
            path: ./Dockerfile
            context: .
resources:
    agent-framework:
        type: host.containerapp
        port: 80
